name: autox
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  fetch_client: ^1.2.1
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  get_thumbnail_video: ^0.7.3
  go_router: ^18.0.2
  http: ^1.6.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  mime: ^2.1.0
  supabase_flutter: ^2.18.0
  url_launcher: ^6.3.3
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-400.ttf
        - asset: assets/fonts/Fraunces-600.ttf
          weight: 600
        - asset: assets/fonts/Fraunces-700.ttf
          weight: 700
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-400.ttf
        - asset: assets/fonts/PlusJakartaSans-500.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-600.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-700.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-800.ttf
          weight: 800
