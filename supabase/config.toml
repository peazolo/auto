# Supabase CLI config (used by `supabase link` / `supabase functions deploy`).
project_id = "avfvbzfwvfdfvveebbgc"

[auth]
site_url = "https://peazolo.github.io/auto/"
additional_redirect_urls = ["https://peazolo.github.io/auto/", "io.autox.app://login-callback", "http://localhost:8080"]

# The reminders job authenticates with the Vault secret `autox_cron_secret` instead of a user JWT.
[functions.reminders]
verify_jwt = false

[functions.diagnose]
verify_jwt = true

[functions.delete-account]
verify_jwt = true
