name: Build & deploy

# Builds the web app (deployed to GitHub Pages) and an Android APK on every push to main.
# Uses the AUTOX Supabase project by default. To point at another project, add the
# repository secrets SUPABASE_URL and SUPABASE_ANON_KEY.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - name: Write env.json
        run: |
          cat > env.json <<JSON
          {
            "SUPABASE_URL": "${{ secrets.SUPABASE_URL || 'https://avfvbzfwvfdfvveebbgc.supabase.co' }}",
            "SUPABASE_ANON_KEY": "${{ secrets.SUPABASE_ANON_KEY || 'sb_publishable_9-nKIK9kInAF-Mkdln1f6w_PPaplxoR' }}",
            "WEB_REDIRECT_URL": "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          }
          JSON
      - run: flutter pub get
      - run: flutter build web --release --no-web-resources-cdn --no-wasm-dry-run --base-href "/${{ github.event.repository.name }}/" --dart-define-from-file=env.json
      # GitHub Pages has no SPA rewrites: serve the app for every unknown path.
      - run: cp build/web/index.html build/web/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - name: Write env.json
        run: |
          cat > env.json <<JSON
          {
            "SUPABASE_URL": "${{ secrets.SUPABASE_URL || 'https://avfvbzfwvfdfvveebbgc.supabase.co' }}",
            "SUPABASE_ANON_KEY": "${{ secrets.SUPABASE_ANON_KEY || 'sb_publishable_9-nKIK9kInAF-Mkdln1f6w_PPaplxoR' }}",
            "WEB_REDIRECT_URL": "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          }
          JSON
      - run: flutter pub get
      - run: flutter build apk --release --dart-define-from-file=env.json
      - uses: actions/upload-artifact@v4
        with:
          name: autox-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
